<meta name="description" content="Network engineer workspace: network tools, troubleshooting, CCNA notes, interview practice and projects.">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
:root{--bg:#0b0f17;--surface:#141b26;--surface-light:#1e2a3a;--border:#2a3a4e;--text:#e7edf5;--text-secondary:#9aaebf;--accent:#3b82f6;--accent-glow:#3b82f680;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--card-radius:16px;--transition:all .2s ease;--sidebar-width:260px;}
.light-mode{--bg:#f4f7fc;--surface:#fff;--surface-light:#eef2f8;--border:#d4deeb;--text:#1e2a3a;--text-secondary:#5e6f84;--accent:#2563eb;--accent-glow:#2563eb40;--success:#059669;--warning:#d97706;--danger:#dc2626;}
body{background:var(--bg);color:var(--text);display:flex;min-height:100vh;transition:background-color .2s,color .2s;}
.sidebar{width:var(--sidebar-width);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:20;transition:transform .2s ease;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.sidebar-header{padding:24px 18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.logo-icon{background:var(--accent);width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:0 0 15px var(--accent-glow);}
.logo-text{font-weight:700;font-size:1.1rem;letter-spacing:-.5px;}
.logo-text span{color:var(--accent);font-weight:800;}
.nav-section{padding:16px 12px 8px;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-secondary);font-weight:600;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 16px;margin:2px 8px;border-radius:8px;color:var(--text-secondary);transition:var(--transition);cursor:pointer;font-size:.9rem;font-weight:500;}
.nav-item i{width:18px;text-align:center;font-size:1rem;}
.nav-item:hover,.nav-item.active{background:var(--surface-light);color:var(--text);}
.nav-item.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px var(--accent-glow);}
.nav-item.active i{color:#fff;}
.main{flex:1;margin-left:var(--sidebar-width);display:flex;flex-direction:column;min-width:0;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:15;gap:16px;flex-wrap:wrap;}
.search-wrapper{flex:1;max-width:400px;position:relative;}
.search-wrapper i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-secondary);font-size:.9rem;}
.search-wrapper input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:30px;padding:10px 18px 10px 40px;color:var(--text);font-size:.9rem;outline:none;transition:var(--transition);}
.search-wrapper input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.top-actions{display:flex;align-items:center;gap:16px;}
.theme-toggle,.mobile-menu-btn{background:var(--surface-light);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition);}
.theme-toggle:hover,.mobile-menu-btn:hover{background:var(--border);}
.mobile-menu-btn{display:none;}
.avatar{background:var(--accent);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;}
.content{padding:28px;display:flex;flex-direction:column;gap:28px;flex:1;}
.page-title{font-size:1.8rem;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;justify-content:space-between;}
.page-title small{font-size:.85rem;font-weight:400;color:var(--text-secondary);background:var(--surface-light);padding:6px 14px;border-radius:30px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);padding:18px 20px;display:flex;flex-direction:column;gap:6px;transition:var(--transition);}
.stat-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.stat-label{font-size:.8rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.stat-value{font-size:1.9rem;font-weight:700;line-height:1;}
.stat-sub{font-size:.8rem;color:var(--text-secondary);}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);padding:20px;display:flex;flex-direction:column;gap:8px;transition:var(--transition);cursor:pointer;}
.dash-card:hover{border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.2);transform:translateY(-2px);}
.dash-icon{width:40px;height:40px;border-radius:10px;background:var(--surface-light);display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:var(--accent);margin-bottom:6px;}
.dash-title{font-weight:600;font-size:1rem;}
.dash-desc{font-size:.8rem;color:var(--text-secondary);line-height:1.4;}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);padding:24px;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.section-header h2{font-size:1.3rem;font-weight:700;display:flex;align-items:center;gap:10px;}
.section-header h2 i{color:var(--accent);}
.badge{background:var(--surface-light);padding:4px 10px;border-radius:30px;font-size:.75rem;font-weight:600;color:var(--text-secondary);}
.btn{background:var(--surface-light);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;font-size:.85rem;font-weight:500;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#2563eb;box-shadow:0 4px 14px var(--accent-glow);}
.btn:hover{background:var(--border);}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-danger:hover{background:#dc2626;}
.btn-sm{padding:4px 10px;font-size:.75rem;}
.table-wrapper{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:.85rem;}
th{text-align:left;padding:12px 16px;background:var(--surface-light);color:var(--text-secondary);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
td{padding:12px 16px;border-top:1px solid var(--border);white-space:nowrap;}
tr:hover td{background:var(--surface-light);}
.status-badge{padding:4px 10px;border-radius:30px;font-size:.7rem;font-weight:600;text-transform:uppercase;}
.status-open{background:#ef444420;color:#ef4444;}
.status-progress{background:#f59e0b20;color:#f59e0b;}
.status-resolved{background:#10b98120;color:#10b981;}
.status-closed{background:#6b728020;color:#9aaebf;}
.status-planned{background:#3b82f620;color:#3b82f6;}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}
.tool-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:18px;}
.tool-card h3{font-size:.95rem;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--accent);}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:.75rem;color:var(--text-secondary);margin-bottom:5px;font-weight:500;}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:9px 12px;color:var(--text);font-size:.85rem;outline:none;transition:var(--transition);}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}
.result-box{background:var(--surface-light);border-radius:8px;padding:14px;margin-top:12px;font-size:.82rem;line-height:1.6;word-break:break-word;}
.result-box strong{color:var(--accent);}
.copy-btn{background:transparent;border:1px solid var(--border);color:var(--text-secondary);padding:4px 10px;border-radius:6px;font-size:.7rem;cursor:pointer;transition:var(--transition);margin-left:8px;}
.copy-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;padding-bottom:2px;}
.tab{padding:10px 18px;font-size:.85rem;font-weight:500;color:var(--text-secondary);border-bottom:2px solid transparent;cursor:pointer;transition:var(--transition);white-space:nowrap;background:none;border:none;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab:hover{color:var(--text);}
.tab-btn{padding:10px 18px;font-size:.85rem;font-weight:500;color:var(--text-secondary);border:none;border-bottom:2px solid transparent;cursor:pointer;transition:var(--transition);white-space:nowrap;background:none;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-btn:hover{color:var(--text);}
.panel{display:none;}
.panel.active{display:block;}
.troubleshoot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:20px;}
.troubleshoot-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:.82rem;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:10px;}
.troubleshoot-item:hover{border-color:var(--accent);background:var(--surface-light);}
.troubleshoot-item i{color:var(--warning);}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-overlay.active{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);max-width:700px;width:100%;max-height:80vh;overflow-y:auto;padding:28px;position:relative;}
.modal-close{position:absolute;top:16px;right:16px;background:var(--surface-light);border:none;color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition);}
.modal-close:hover{background:var(--danger);color:#fff;}
.ai-panel{background:linear-gradient(135deg,var(--surface) 0%,var(--surface-light) 100%);border:1px solid var(--border);border-radius:var(--card-radius);padding:24px;position:relative;overflow:hidden;}
.ai-panel::before{content:'';position:absolute;top:-50%;right:-20%;width:300px;height:300px;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);border-radius:50%;pointer-events:none;}
.ai-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;position:relative;}
.ai-header i{font-size:1.5rem;color:var(--accent);}
.ai-input-wrapper{display:flex;gap:10px;position:relative;}
.ai-input-wrapper input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:30px;padding:12px 20px;color:var(--text);font-size:.9rem;outline:none;}
.ai-input-wrapper input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.ai-response{margin-top:16px;padding:16px;background:var(--bg);border-radius:10px;border-left:3px solid var(--accent);font-size:.85rem;line-height:1.6;display:none;}
@media(max-width:900px){.sidebar{transform:translateX(-100%);}.sidebar.open{transform:translateX(0);}.main{margin-left:0;}.mobile-menu-btn{display:flex;}}
@media(max-width:600px){.content{padding:16px;}.topbar{padding:12px 16px;}.page-title{font-size:1.3rem;}.stats-grid{grid-template-columns:repeat(2,1fr);}.dashboard-grid{grid-template-columns:1fr;}}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}::-webkit-scrollbar-thumb:hover{background:var(--text-secondary);}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.section,.dash-card,.stat-card{animation:fadeIn .3s ease forwards;}
.note-highlight{background:var(--surface-light);border-left:3px solid var(--accent);padding:12px 16px;border-radius:8px;margin:10px 0;font-size:.85rem;line-height:1.7;}

/* ── Global search dropdown ───────────────────────────────────────────── */
#globalSearchResults{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);max-height:360px;overflow-y:auto;z-index:50;}
#globalSearchResults.active{display:block;}
.gsr-item{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
.gsr-item:last-child{border-bottom:none;}
.gsr-item:hover{background:var(--surface-light);}
.gsr-type{font-size:.65rem;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:700;}
.gsr-label{font-size:.85rem;font-weight:600;}
.gsr-sub{font-size:.72rem;color:var(--text-secondary);}
.gsr-empty{padding:14px;text-align:center;color:var(--text-secondary);font-size:.82rem;}

/* ── Hint / mini-table / cable / glossary shared bits ───────────────────── */
.hint-line{font-size:.72rem;color:var(--text-secondary);margin-top:8px;line-height:1.5;}
.hint-line a{color:var(--accent);}
.mini-table{width:100%;border-collapse:collapse;font-size:.75rem;margin-top:6px;}
.mini-table th{text-align:left;padding:6px 8px;background:var(--surface-light);color:var(--text-secondary);font-weight:600;}
.mini-table td{padding:6px 8px;border-top:1px solid var(--border);}
.vlsm-result{overflow-x:auto;}
.cable-row{padding:10px 0;border-bottom:1px solid var(--border);font-size:.82rem;}
.cable-row:last-child{border-bottom:none;}
.cable-use{color:var(--text-secondary);font-size:.78rem;margin-top:2px;}
.cable-wiring{font-size:.75rem;margin-top:4px;line-height:1.5;}
.kb-tag{cursor:pointer;transition:var(--transition);}
.kb-tag.active,.kb-tag:hover{background:var(--accent);color:#fff;}


/* ── Shared small components (VLAN list, etc.) ── */
.chip-toggle{display:inline-flex;align-items:center;gap:6px;background:var(--surface-light);border:1px solid var(--border);padding:7px 12px;border-radius:20px;font-size:.78rem;color:var(--text-secondary);cursor:pointer;transition:var(--transition);}
.chip-toggle:hover{border-color:var(--accent);color:var(--text);}
.chip-toggle input{accent-color:var(--accent);}
.chip-toggle.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent);}
.code-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;font-family:monospace;font-size:.78rem;color:var(--text);overflow-x:auto;line-height:1.7;white-space:pre;max-height:70vh;}
.mini-input{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-size:.8rem;outline:none;width:100%;}
.mini-input:focus{border-color:var(--accent);}

/* ── Print-friendly ──────────────────────────────────────────────────── */
@media print{
  .sidebar,.topbar,.tabs,.modal-overlay{display:none!important;}
  .main{margin-left:0!important;}
  body{background:#fff!important;color:#000!important;}
  .section,.tool-card,.result-box,.code-block{border-color:#ccc!important;background:#fff!important;color:#000!important;}
}

/* ============================================================
   PHONE-APP LAYER (PWA)  — phone/installed = app, PC browser = website
   ============================================================ */
html{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
body{overscroll-behavior-y:none;}
.app-title,.bottom-nav,.more-sheet,.sheet-backdrop,.install-banner,#splash{display:none;}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1000;background:linear-gradient(160deg,#0b0f17 0%,#1e3a8a 100%);flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s ease,visibility .4s;}
html.is-app #splash{display:flex;}
#splash.hide{opacity:0;visibility:hidden;}
.splash-logo{width:96px;height:96px;border-radius:28px;background:var(--accent);color:#fff;font-size:46px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px var(--accent-glow);animation:splashPop .6s ease both;}
@keyframes splashPop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.splash-name{font-size:1.8rem;font-weight:800;color:#fff;letter-spacing:-.5px;}
.splash-name span{color:#60a5fa;}
.splash-sub{font-size:.75rem;color:#9aaebf;letter-spacing:1.5px;text-transform:uppercase;}
html.is-app body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
html.is-app input,html.is-app textarea,html.is-app select,html.is-app .code-block,html.is-app .result-box{user-select:text;-webkit-user-select:text;}

@media(max-width:900px){
  .sidebar,.mobile-menu-btn,.avatar{display:none!important;}
  .main{margin-left:0;}
  :root{--card-radius:20px;}

  .topbar{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 16px;background:linear-gradient(135deg,#1e40af 0%,#3b82f6 100%);border-bottom:none;border-radius:0 0 28px 28px;box-shadow:0 10px 28px rgba(37,99,235,.35);gap:12px;}
  .app-title{display:flex;align-items:center;gap:10px;flex:1;min-width:0;color:#fff;font-size:1.3rem;font-weight:800;letter-spacing:-.4px;}
  .app-title .logo-icon{width:36px;height:36px;font-size:16px;background:rgba(255,255,255,.2);box-shadow:none;flex-shrink:0;}
  #appTitleText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top-actions{gap:10px;}
  .theme-toggle{background:rgba(255,255,255,.2);border:none;color:#fff;width:42px;height:42px;}
  .search-wrapper{order:3;flex:1 1 100%;max-width:none;}
  .search-wrapper input{border:none;background:rgba(255,255,255,.96);color:#1e2a3a;height:46px;font-size:16px;}
  .search-wrapper i{color:#5e6f84;}

  .content{padding:20px 16px calc(104px + env(safe-area-inset-bottom,0px));gap:20px;}
  .page-title{font-size:1.5rem;font-weight:800;flex-wrap:wrap;gap:8px;}
  .section{padding:18px;border-radius:22px;}
  .section-header h2{font-size:1.1rem;}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
  .stat-card{padding:16px;border-radius:20px;}
  .stat-value{font-size:1.7rem;font-weight:800;}
  .dashboard-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
  .dash-card{padding:16px;border-radius:22px;gap:6px;}
  .dash-icon{width:50px;height:50px;border-radius:16px;font-size:1.3rem;background:linear-gradient(135deg,var(--accent),#6366f1);color:#fff;box-shadow:0 6px 16px var(--accent-glow);}
  .dash-title{font-weight:800;font-size:.95rem;}
  .dash-desc{font-size:.72rem;}
  .tools-grid{grid-template-columns:1fr;}
  .tool-card{border-radius:18px;}
  .btn{min-height:42px;border-radius:12px;font-weight:600;}
  .btn-sm{min-height:34px;}
  .form-group input,.form-group select,.form-group textarea,.mini-input,.ai-input-wrapper input{font-size:16px;}
  .btn:active,.dash-card:active,.troubleshoot-item:active,.stat-card:active,.sheet-tile:active{transform:scale(.97);}
  .troubleshoot-grid{grid-template-columns:repeat(2,1fr);}

  /* modals become bottom sheets */
  .modal-overlay{align-items:flex-end;padding:0;}
  .modal{max-width:none;border-radius:26px 26px 0 0;max-height:90vh;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));border-bottom:none;animation:sheetUp .28s ease;}
  @keyframes sheetUp{from{transform:translateY(100%);}to{transform:none;}}

  /* toasts sit above the bottom bar */
  body > div[style*="bottom: 20px"]{bottom:calc(100px + env(safe-area-inset-bottom,0px))!important;}

  /* bottom navigation */
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;box-shadow:0 -10px 30px rgba(0,0,0,.25);}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;background:none;border:none;color:var(--text-secondary);font-size:.68rem;font-weight:700;cursor:pointer;transition:var(--transition);}

function ipToInt(ip){return ip.split('.').reduce((a,o)=>(a<<8)+parseInt(o,10),0)>>>0;}
function intToIp(i){return [(i>>>24)&255,(i>>>16)&255,(i>>>8)&255,i&255].join('.');}
function prefixToMask(p){return p===0?0:(0xFFFFFFFF<<(32-p))>>>0;}
function wildcardFromMask(m){return intToIp((~m)>>>0);}
function calcIP(ip,cidr){
  const mask=prefixToMask(cidr);
  const ipInt=ipToInt(ip);
  const network=(ipInt&mask)>>>0;
  const broadcast=(network|(~mask>>>0))>>>0;
  const first=(network+1)>>>0;
  const last=(broadcast-1)>>>0;
  const totalHosts=Math.pow(2,32-cidr);
  const usableHosts=totalHosts>2?totalHosts-2:0;
  const binary=ip.split('.').map(o=>parseInt(o).toString(2).padStart(8,'0')).join('.');
  let ipClass='A';
  const fo=parseInt(ip.split('.')[0]);
  if(fo>=1&&fo<=126)ipClass='A';else if(fo>=128&&fo<=191)ipClass='B';else if(fo>=192&&fo<=223)ipClass='C';else if(fo>=224&&fo<=239)ipClass='D (Multicast)';else ipClass='E (Experimental)';
  return{network:intToIp(network),broadcast:intToIp(broadcast),first:intToIp(first),last:intToIp(last),totalHosts,usableHosts,wildcard:wildcardFromMask(mask),ipClass,binary,mask:intToIp(mask)};
}

const pdfKnowledge = {
  dns: {
    title: 'DNS - Domain Name System',
    content: `Translates human-readable names to IP addresses. Port 53 (UDP query / TCP zone transfer).

Key Concepts:
• Hierarchical, distributed database of name-to-IP mappings
• Root → TLD (.com, .net) → Authoritative domain servers
• Record types: A (IPv4), AAAA (IPv6), CNAME (alias), MX (mail), PTR (reverse lookup), NS (name server), SOA (start of authority)
• Recursive query: resolver does all the work for the client
• Iterative query: server refers client to next server
• Caching (TTL-based) reduces repeated lookups
• DNS uses UDP/53 for standard queries, TCP/53 for zone transfers and responses >512 bytes

Resolution Flow:
Client → Resolver → Root → TLD → Authoritative`
  },
  udp: {
    title: 'UDP - User Datagram Protocol',
    content: `Connectionless, best-effort transport (RFC 768).

Key Points:
1. No Handshake - No SYN/SYN-ACK/ACK — data sent immediately, lower latency
2. No Guaranteed Delivery - No acknowledgment, retransmission, or ordering
3. 8-Byte Header - Src Port, Dst Port, Length, Checksum only
4. Low Overhead - Ideal for speed-sensitive, loss-tolerant traffic

UDP vs TCP:
• Connection: Connectionless vs Connection-oriented
• Reliability: Best-effort vs Reliable (ACK, retransmit)
• Ordering: Not guaranteed vs Guaranteed sequencing
• Speed: Faster, less overhead vs Slower, more overhead
• Use Cases: DNS, DHCP, VoIP, streaming, SNMP vs HTTP(S), FTP, SSH, email`
  },
  vlan: {
    title: 'VLAN - Virtual LAN',
    content: `Logically segments a single physical switch into multiple broadcast domains.

Key Concepts:
• Each VLAN = separate broadcast domain (reduces broadcast traffic, improves security)
• Devices in different VLANs cannot communicate without a Layer-3 device (router or L3 switch)
• VLAN range: 1-4094 (1-1005 normal, 1006-4094 extended)
• VLAN 1 = default VLAN (all ports initially); VLAN 1002-1005 reserved (legacy)
• Access port: carries traffic for ONE VLAN only, untagged to the end device
• Static VLAN: manually assigned per port (most common)
• Dynamic VLAN: assigned via VMPS/802.1X based on MAC or identity
• VTP (VLAN Trunking Protocol) synchronizes VLAN DB across switches — modes: Server, Client, Transparent

Config:
switchport mode access
switchport access vlan 10`
  },
  trunking: {
    title: 'Trunking & Trunk Ports (802.1Q)',
    content: `A single link that carries traffic for multiple VLANs between switches.

Key Points:
• 802.1Q inserts a 4-byte tag (12-bit VLAN ID) into the Ethernet frame
• Native VLAN: traffic sent untagged over the trunk (default VLAN 1)
• Trunk carries ALL VLANs by default; can be pruned with allowed-vlan list
• DTP (Dynamic Trunking Protocol) can auto-negotiate trunk/access — best practice: disable & hardcode

Sample Configuration:
interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 10,20,30
 switchport trunk native vlan 99`
  },
  interVlan: {
    title: 'Inter-VLAN Routing & MLS',
    content: `How devices in different VLANs communicate.

Methods:
1. Router-on-a-Stick
Single router interface, subdivided into sub-interfaces (one per VLAN), trunked to switch.
Cost-effective but router becomes a bottleneck.
encapsulation dot1q 10

2. Multilayer Switch (MLS/SVI)
Switch Virtual Interfaces (SVI) — one logical L3 interface per VLAN on an L3 switch.
Uses ASIC-based hardware switching = wire-speed routing.
interface vlan 10

3. Router with Multiple NICs

function navigateTo(page){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const nav=document.querySelector(`.nav-item[data-page="${page}"]`);
  if(nav)nav.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
  if(page==='dashboard')renderDashboard();
  else if(page==='networking')renderNetworking();
  else if(page==='tools')renderTools();
  else if(page==='troubleshoot')renderTroubleshoot();
  else if(page==='interview')renderInterview();
  else if(page==='projects')renderProjects();
  else if(page==='assistant')renderAssistant();
}

document.querySelectorAll('.nav-item').forEach(item=>{
  item.addEventListener('click',()=>navigateTo(item.dataset.page));
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-goto]');
  if(el){e.stopPropagation();navigateTo(el.dataset.goto);}
});

    'RSTP':'Rapid STP — 802.1w. Faster convergence (1-2s). Port states: Discarding, Learning, Forwarding. Port roles: Root, Designated, Alternate, Backup. Active handshake with proposal/agreement.',
    'EtherChannel':'Bundle multiple links into one logical link. LACP (802.3ad) or PAgP (Cisco). Modes: active/passive (LACP), desirable/auto (PAgP). Provides load balancing and fault tolerance.',
    'LACP':'Link Aggregation Control Protocol — IEEE standard, mode active/passive. Multi-vendor support. Uses channel-group command.',
    'PAgP':'Port Aggregation Protocol — Cisco proprietary, mode desirable/auto. Only works between Cisco devices.',
    'Port Security':'Restrict MAC addresses on switch port. Violation: protect, restrict, shutdown. Sticky learning saves MACs to config. Maximum MACs limits allowed devices.',
    'DHCP':'Dynamic Host Configuration Protocol — assigns IP, gateway, DNS automatically. DORA process: Discover, Offer, Request, Acknowledge. UDP 67/68. Use ip helper-address for relay across subnets.',
    'DNS':'Domain Name System — resolves names to IPs. Port 53. Hierarchical: Root → TLD → Authoritative. Record types: A, AAAA, CNAME, MX, PTR, NS, SOA. UDP for queries, TCP for zone transfers.',
    'NAT':'Network Address Translation — translates private to public. PAT = overload (many-to-one). Static NAT (one-to-one), Dynamic NAT (pool). Conserves IPv4 addresses.',
    'ACL':'Access Control List — filter traffic. Standard (source only, 1-99), Extended (src/dst/port, 100-199). Named ACLs easier to manage. Implicit deny at end. Wildcard mask = inverse of subnet mask.',
    'RIP':'Distance-vector, hop count max 15. RIPv2 supports VLSM. AD 120. Simple but limited scalability.',
    'OSPF':'Link-state IGP. Areas, LSAs, DR/BDR. AD 110. Metric = cost (bandwidth). Area 0 mandatory. Runs over IP protocol 89. Dijkstra SPF algorithm.',
    'EIGRP':'Advanced distance-vector, Cisco. AD 90. Uses DUAL, feasible successor. Metric = bandwidth + delay. No auto-summary in modern IOS.',
    'BGP':'Path-vector EGP. AS numbers. Used on internet. Port 179. AD 20 (eBGP) / 200 (iBGP). Best path: Weight > Local Pref > AS-Path > Origin > MED.',
    'HSRP':'Hot Standby Router Protocol — Cisco FHRP. Virtual IP, active/standby. Priority default 100, higher wins. Preempt allows reclaiming active role. Hello 3s, Hold 10s.',
    'VRRP':'Virtual Router Redundancy Protocol — open standard FHRP. Master/Backup model. Similar to HSRP but multi-vendor.',
    'GLBP':'Gateway Load Balancing Protocol — Cisco, load balances across gateways. Active/Active model with AVG and AVFs.',
    'FHRP':'First Hop Redundancy Protocol — umbrella for HSRP/VRRP/GLBP. Provides default gateway redundancy.',
    'ARP':'Address Resolution Protocol — maps IP to MAC. Broadcast request, unicast reply. arp -a to view cache. show arp on Cisco.',
    'ICMP':'Internet Control Message Protocol — ping, traceroute. Used for error reporting and diagnostics.',
    'TCP / UDP':'TCP: connection-oriented, reliable, 3-way handshake, sequencing. UDP: connectionless, best-effort, 8-byte header, low overhead. TCP for HTTP(S), FTP, SSH. UDP for DNS, DHCP, VoIP, streaming.',
    'SSH / Telnet':'SSH: encrypted, port 22, secure. Telnet: plaintext, port 23, insecure. Always use SSH in production.',
    'VPN':'Virtual Private Network — encrypted tunnel over public network. Site-to-site, remote access, SSL VPN. IPsec with IKE Phase 1/2. ESP for encryption, AH for integrity.',
    'IPsec':'IP Security — IKE Phase 1 (ISAKMP tunnel), Phase 2 (IPsec SAs). ESP (encryption) vs AH (integrity). Transport mode (host-to-host) vs Tunnel mode (network-to-network).',
    'SDN':'Software-Defined Networking — separates control plane from data plane. Centralized controller (Cisco DNA Center). Northbound APIs (REST), Southbound APIs (NETCONF/RESTCONF). Infrastructure as Code with Ansible, Terraform.',
    'SLAAC':'Stateless Address Autoconfiguration — IPv6 clients generate their own addresses from router prefix + interface ID. No DHCP server needed. DNS gap filled by Stateless DHCPv6.',
    'VXLAN':'Virtual Extensible LAN — overlay for data center. Encapsulates L2 frames in L3 UDP (port 4789). 16 million VNIs vs 4094 VLANs. Used in spine-leaf architectures.',
    'Cable Types':'Straight-through: PC↔Switch, Switch↔Router (dissimilar devices). Crossover: Switch↔Switch, PC↔PC (similar devices) — auto-MDIX makes this mostly automatic today. Rollover/Console: initial CLI setup only, not for data. Fiber: SM (long-haul, laser) vs MM (shorter, LED).',
  };
  document.getElementById('topicDetail').innerHTML=`
    <div style="margin-top:20px;padding:18px;background:var(--bg);border-radius:10px;border:1px solid var(--border);">
      <h3 style="color:var(--accent);margin-bottom:12px;">${topic}</h3>
      <p style="font-size:.9rem;line-height:1.7;">${details[topic]||'Details coming soon.'}</p>
      <div class="note-highlight">
        <strong>📝 Key Note:</strong> Practice this topic in Packet Tracer, GNS3, EVE-NG, or CML.
      </div>
    </div>
  `;
}

/* ============================================================
   SUBNETTING PRACTICE GAME
   ============================================================ */
let gameState=null;
function randomSubnetQuestion(){
  const cidr=Math.floor(Math.random()*13)+19; // /19 - /31 range mostly useful ones
  const clampedCidr=Math.min(30,Math.max(20,cidr));
  const oct1=[10,172,192][Math.floor(Math.random()*3)];
  const ip=`${oct1}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.0`;
  const types=['usable','network','broadcast','mask'];
  const type=types[Math.floor(Math.random()*types.length)];
  const hostIp=ip.split('.').slice(0,3).join('.')+'.77';
  const r=calcIP(ip,clampedCidr);
  let question,answer;
  if(type==='usable'){question=`${ip}/${clampedCidr} — how many usable hosts?`;answer=String(r.usableHosts);}
  else if(type==='network'){question=`What's the Network ID for a host at ${hostIp}/${clampedCidr}?`;answer=calcIP(hostIp,clampedCidr).network;}
  else if(type==='broadcast'){question=`What's the Broadcast address for ${ip}/${clampedCidr}?`;answer=r.broadcast;}
  else{question=`What's the subnet mask for /${clampedCidr}?`;answer=r.mask;}
  return {question,answer};
}
window.startSubnetGame=function(){
  gameState={score:0,timeLeft:60,current:randomSubnetQuestion(),timer:null};
  renderGameRound();
  gameState.timer=setInterval(()=>{
    gameState.timeLeft--;
    const t=document.getElementById('gameTimer');
    if(t)t.textContent=gameState.timeLeft+'s';
    if(gameState.timeLeft<=0){endSubnetGame();}
  },1000);
}
function renderGameRound(){
  const area=document.getElementById('gameArea');
  if(!area||!gameState)return;
  area.innerHTML=`
    <div style="padding:18px;background:var(--bg);border-radius:10px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
        <span class="badge">Score: <strong id="gameScore">${gameState.score}</strong></span>
        <span class="badge" id="gameTimer">${gameState.timeLeft}s</span>
      </div>
      <p style="font-weight:600;margin-bottom:12px;font-size:1.05rem;">${gameState.current.question}</p>
      <div style="display:flex;gap:10px;">
        <input type="text" id="gameAnswerInput" placeholder="Type your answer..." style="flex:1;" onkeydown="if(event.key==='Enter')submitGameAnswer()">
        <button class="btn btn-primary" onclick="submitGameAnswer()">Submit</button>
      </div>
      <div id="gameFeedback" style="margin-top:8px;font-size:.85rem;"></div>
    </div>
  `;
  document.getElementById('gameAnswerInput')?.focus();
}
window.submitGameAnswer=function(){
  if(!gameState)return;
  const val=(document.getElementById('gameAnswerInput').value||'').trim();
  const correct=val===gameState.current.answer;
  if(correct){
    gameState.score++;
    document.getElementById('gameFeedback').innerHTML='<span style="color:var(--success);">Correct!</span>';
  }else{
    document.getElementById('gameFeedback').innerHTML=`<span style="color:var(--danger);">Answer: ${gameState.current.answer}</span>`;
  }
  gameState.current=randomSubnetQuestion();
  setTimeout(renderGameRound,correct?150:600);
}
function endSubnetGame(){
  clearInterval(gameState.timer);
  const score=gameState.score;
  const today=new Date().toISOString().split('T')[0];
  if(score>subnetGameStats.best)subnetGameStats.best=score;
  if(subnetGameStats.lastPlayDate!==today){
    const yesterday=new Date(Date.now()-86400000).toISOString().split('T')[0];
    subnetGameStats.streak=(subnetGameStats.lastPlayDate===yesterday)?subnetGameStats.streak+1:1;
    subnetGameStats.lastPlayDate=today;
  }
  save('subnetGameStats',subnetGameStats);
  const area=document.getElementById('gameArea');
  if(!area){gameState=null;return;}
  area.innerHTML=`
    <div style="padding:24px;background:var(--bg);border-radius:10px;text-align:center;">
      <h3 style="color:var(--accent);font-size:1.6rem;">Time's up!</h3>
      <p style="font-size:1.2rem;margin:10px 0;">Score: <strong>${score}</strong> ${score>=subnetGameStats.best&&score>0?'🏆 New Best!':''}</p>
      <p style="color:var(--text-secondary);font-size:.85rem;">Streak: ${subnetGameStats.streak} day(s)</p>
      <button class="btn btn-primary" onclick="startSubnetGame()" style="margin-top:14px;">Play Again</button>
    </div>
  `;
  gameState=null;
}

window.askAssistantFull=function(){
  const input=document.getElementById('aiInputFull').value.trim();
  if(!input)return;
  const resp=document.getElementById('aiResponseFull');
  resp.style.display='block';
  const lower=input.toLowerCase();
  let answer='';

  // Search PDF knowledge base
  let found=null;
  for(const[key,val]of Object.entries(pdfKnowledge)){
    if(lower.includes(key.toLowerCase())||val.title.toLowerCase().includes(lower)){
      found=val;break;
    }
  }
  // Also check for specific keywords
  if(!found){
    if(lower.includes('ospf'))found=pdfKnowledge.ospf;
    else if(lower.includes('vlan'))found=pdfKnowledge.vlan;
    else if(lower.includes('trunk'))found=pdfKnowledge.trunking;
    else if(lower.includes('dhcp'))found=pdfKnowledge.dhcp;
    else if(lower.includes('bgp'))found=pdfKnowledge.bgp;
    else if(lower.includes('dns'))found=pdfKnowledge.dns;
    else if(lower.includes('udp'))found=pdfKnowledge.udp;
    else if(lower.includes('stp')||lower.includes('spanning'))found=pdfKnowledge.stp;
    else if(lower.includes('acl')||lower.includes('access'))found=pdfKnowledge.acl;
    else if(lower.includes('firewall'))found=pdfKnowledge.firewalls;
    else if(lower.includes('vpn')||lower.includes('ipsec'))found=pdfKnowledge.vpn;
    else if(lower.includes('hsrp'))found=pdfKnowledge.hsrp;
    else if(lower.includes('subnet')||lower.includes('cidr')||lower.includes('vlsm'))found=pdfKnowledge.ipAddressing;
    else if(lower.includes('slaac')||lower.includes('ipv6'))found=pdfKnowledge.slaac;
    else if(lower.includes('sd-wan')||lower.includes('sdn')||lower.includes('automation'))found=pdfKnowledge.sdn;
    else if(lower.includes('etherchannel')||lower.includes('lacp')||lower.includes('pagp'))found=pdfKnowledge.etherchannel;
    else if(lower.includes('arp'))found=pdfKnowledge.arp;
    else if(lower.includes('osi')||lower.includes('tcp/ip')||lower.includes('model'))found=pdfKnowledge.networkModels;
    else if(lower.includes('snooping'))found=pdfKnowledge.dhcpSnooping;
    else if(lower.includes('inter-vlan')||lower.includes('roas')||lower.includes('svi'))found=pdfKnowledge.interVlan;
  }

  if(found){
    answer=`<strong>${found.title}</strong><br><br>${found.content}`;
  } else {
    answer=`<strong>Explanation:</strong> I can help with Cisco commands, network troubleshooting, subnetting, Linux, firewall, and cloud networking.<br><br>
    <strong>Try asking about:</strong><br>
    • OSPF, VLAN, Trunk, DHCP, BGP, STP, ACL, NAT<br>
    • DNS, UDP, IPsec, VPN, HSRP, VRRP, GLBP<br>
    • Subnetting, VLSM, CIDR, IPv6, SLAAC<br>
    • Firewall, SDN, Automation, EtherChannel<br><br>
    <strong>Or ask a specific question like:</strong><br>
    "How to configure OSPF?"<br>
    "Explain DHCP DORA process"<br>
    "What is BGP path selection?"`;
  }
  resp.innerHTML=answer;
};

/* ============================================================
   GLOBAL SEARCH (was completely unwired — now live)
   ============================================================ */
function buildSearchIndex(){
  const idx=[];
  ports.forEach(p=>idx.push({type:'Port',label:`${p.service} — ${p.port}/${p.proto}`,sub:p.desc,page:'tools'}));
  projects.forEach(p=>idx.push({type:'Project',label:p.name,sub:p.desc,page:'projects'}));
  return idx;
}
function runGlobalSearch(q){
  const resEl=document.getElementById('globalSearchResults');
  if(!q||q.trim().length<2){resEl.classList.remove('active');resEl.innerHTML='';return;}
  const term=q.toLowerCase();
  const idx=buildSearchIndex();
  const matches=idx.filter(item=>item.label.toLowerCase().includes(term)||item.sub.toLowerCase().includes(term)).slice(0,12);
  if(!matches.length){resEl.innerHTML='<div class="gsr-empty">No results</div>';resEl.classList.add('active');return;}
  resEl.innerHTML=matches.map(m=>`<div class="gsr-item" data-page="${m.page}"><span class="gsr-type">${m.type}</span><span class="gsr-label">${m.label}</span><span class="gsr-sub">${m.sub}</span></div>`).join('');
  resEl.classList.add('active');
  resEl.querySelectorAll('.gsr-item').forEach(el=>{
    el.addEventListener('click',()=>{
      navigateTo(el.dataset.page);
      resEl.classList.remove('active');
      document.getElementById('globalSearch').value='';
    });
  });
}
document.getElementById('globalSearch').addEventListener('input',(e)=>runGlobalSearch(e.target.value));
document.getElementById('globalSearch').addEventListener('focus',(e)=>{ if(e.target.value.trim().length>=2) runGlobalSearch(e.target.value); });
document.addEventListener('click',(e)=>{
  const wrap=document.querySelector('.search-wrapper');
  if(wrap && !wrap.contains(e.target)){document.getElementById('globalSearchResults').classList.remove('active');}
});

function exportBackup(){
  const backup={
    vlans,
    projects,quizStats,subnetGameStats,
    exportedAt:new Date().toISOString(),version:1
  };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`itops-backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  showToast('Backup exported');
}
function importBackup(file){
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data.vlans){vlans=data.vlans;save('vlans',vlans);}
      if(data.projects){projects=data.projects;save('projects',projects);}
      if(data.quizStats){quizStats=data.quizStats;save('quizStats',quizStats);}
      if(data.subnetGameStats){subnetGameStats=data.subnetGameStats;save('subnetGameStats',subnetGameStats);}
      showToast('Backup imported — reloading...');
      setTimeout(()=>navigateTo('dashboard'),800);
    }catch(err){showToast('Invalid backup file','danger');}
  };
  reader.readAsText(file);
}
window.exportBackup=exportBackup;
document.getElementById('backupBtn').addEventListener('click',()=>{

});

/* ============================================================
   PHONE-APP LAYER: bottom nav, More sheet, back button, install
   banner, offline toasts
   ============================================================ */
(function(){
  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  const isMobile=()=>window.matchMedia('(max-width:900px)').matches;
  const mainPages=['dashboard','tools','interview'];
  const labels={};
  document.querySelectorAll('.sidebar .nav-item').forEach(n=>{labels[n.dataset.page]=n.textContent.trim();});
  const sheet=document.getElementById('moreSheet');
  const backdrop=document.getElementById('sheetBackdrop');

  function buildSheet(){
    let html='<div class="sheet-handle"></div>',open=false;
    document.querySelectorAll('.sidebar > *').forEach(el=>{
      if(el.classList.contains('nav-section')){
        if(open)html+='</div>';
        html+='<div class="sheet-heading">'+el.textContent+'</div><div class="sheet-grid">';open=true;
      }else if(el.classList.contains('nav-item')){
        const ic=el.querySelector('i');
        html+='<button class="sheet-tile" data-page="'+el.dataset.page+'"><i class="'+(ic?ic.className:'')+'"></i><span>'+el.textContent.trim()+'</span></button>';
      }
    });
    if(open)html+='</div>';
    html+='<div id="sheetInstall"></div>';
    sheet.innerHTML=html;
  }
  function openSheet(){sheet.classList.add('open');backdrop.classList.add('open');}
  function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('open');}
  buildSheet();
  if(isMobile()){const gs=document.getElementById('globalSearch');if(gs)gs.placeholder='Search commands, tools, notes...';}

  function syncChrome(page){
    document.querySelectorAll('.bn-item[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
    const more=document.getElementById('bnMore');
    if(more)more.classList.toggle('active',!mainPages.includes(page));
    sheet.querySelectorAll('.sheet-tile').forEach(t=>t.classList.toggle('active',t.dataset.page===page));
    const t=document.getElementById('appTitleText');
    if(t)t.textContent=(page==='dashboard'||!labels[page])?'IT Ops Center':labels[page];
  }

  /* wrap navigateTo: sync chrome + Android back-button history */
  const _nav=navigateTo;
  navigateTo=function(page,fromPop){
    _nav(page);
    syncChrome(page);
    closeSheet();
    if(fromPop!==true){
      try{if(!window.__HUB&&!(history.state&&history.state.page===page))history.pushState({page:page},'');}catch(e){}
    }
  };
  try{history.replaceState({page:'dashboard'},'');}catch(e){}
  window.addEventListener('popstate',e=>{
    navigateTo((e.state&&e.state.page)||'dashboard',true);
  });

  document.getElementById('bottomNav').addEventListener('click',e=>{
    const b=e.target.closest('.bn-item');if(!b)return;
    if(navigator.vibrate)try{navigator.vibrate(10);}catch(err){}
    if(b.id==='bnMore'){sheet.classList.contains('open')?closeSheet():openSheet();return;}
    navigateTo(b.dataset.page);
  });
  sheet.addEventListener('click',e=>{
    const t=e.target.closest('.sheet-tile');
    if(t)navigateTo(t.dataset.page);
  });
  backdrop.addEventListener('click',closeSheet);
  syncChrome('dashboard');

  /* ---- install banner ---- */
  let deferred=null;
  const banner=document.getElementById('installBanner');
  const dismissed=()=>{try{return localStorage.getItem('installDismissed')==='1';}catch(e){return false;}};
  const hideBanner=()=>banner.classList.remove('show');
  function addSheetInstall(){
    const box=document.getElementById('sheetInstall');
    if(!box||!deferred||standalone)return;
    box.innerHTML='<button class="btn btn-primary sheet-install" id="sheetInstallBtn"><i class="fas fa-download"></i> Install App</button>';
    document.getElementById('sheetInstallBtn').addEventListener('click',doInstall);
  }
  function doInstall(){
    if(!deferred)return;
    deferred.prompt();
    deferred.userChoice.then(()=>{deferred=null;hideBanner();closeSheet();const b=document.getElementById('sheetInstall');if(b)b.innerHTML='';});
  }
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();deferred=e;
    if(!standalone&&!dismissed()&&isMobile())banner.classList.add('show');
    addSheetInstall();
  });
  window.addEventListener('appinstalled',()=>{deferred=null;hideBanner();showToast('App installed');});
  document.getElementById('ibInstall').addEventListener('click',doInstall);
  document.getElementById('ibClose').addEventListener('click',()=>{hideBanner();try{localStorage.setItem('installDismissed','1');}catch(e){}});
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone&&!dismissed()&&isMobile()){
    document.getElementById('ibSub').textContent='Tap the Share button, then "Add to Home Screen"';
    document.getElementById('ibInstall').style.display='none';
    setTimeout(()=>banner.classList.add('show'),2500);
  }

  /* ---- online / offline ---- */
  window.addEventListener('offline',()=>showToast('You are offline — app keeps working','warning'));
  window.addEventListener('online',()=>showToast('Back online'));

  /* ---- splash (only visible when installed) ---- */
  window.addEventListener('load',()=>{
    const sp=document.getElementById('splash');
    if(!sp)return;
    setTimeout(()=>{sp.classList.add('hide');setTimeout(()=>sp.remove(),500);},standalone?700:0);
  });
})();

(function initFromUrl(){
  const params=new URLSearchParams(location.search);
  const page=params.get('page');
  const section=params.get('section');
  const valid=['dashboard','networking','tools','cisco','troubleshoot','interview','projects','assistant'];
  if(page&&valid.includes(page)){

    if(page==='interview'){
      setTimeout(()=>{
        const target=document.getElementById(section==='daily'?'gameArea':'quizContainer');
        if(target)target.scrollIntoView({behavior:'smooth',block:'center'});
      },200);
    }
  }else{
    renderDashboard();
  }
})();

</script>

<script id="hub-bridge">
/* Hub bridge: lets the IT Ops Hub drive this module (page navigation, theme, search). */
(function(){
  if(!window.__HUB) return;
  function post(m){ try{ parent.postMessage(Object.assign({hub:true,module:'ops'},m),location.origin); }catch(e){} }
  window.hubOpen=function(mod,item){ post({type:'open',target:mod,item:item}); };
  function applyTheme(th){
    if(!th) return;
    document.body.classList.toggle('light-mode',th==='light');
    var ic=document.querySelector('#themeToggle i'); if(ic) ic.className=th==='light'?'fas fa-sun':'fas fa-moon';
  }
  var _nav=navigateTo;
  navigateTo=function(page,fromPop){ _nav(page,fromPop); post({type:'state',item:page}); };
  window.addEventListener('message',function(e){
    if(e.origin!==location.origin) return;
    var m=e.data; if(!m||!m.hub) return;
    if(m.type==='init'){ applyTheme(m.theme); navigateTo(m.item||'dashboard'); }
    else if(m.type==='goto'){ navigateTo(m.item); }
    else if(m.type==='theme'){ applyTheme(m.theme); }
    else if(m.type==='search'){
      var gs=document.getElementById('globalSearch');
      if(gs){ gs.value=m.q||''; gs.focus(); if(typeof runGlobalSearch==='function') runGlobalSearch(m.q||''); }
    }
  });
  post({type:'ready'});
})();
</script>
